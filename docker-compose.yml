services:
  zitadel-login:
    build:
      context: .
      dockerfile: Dockerfile.login
      args:
        NEXT_PUBLIC_BASE_PATH: '${ZITADEL_LOGIN_BASE_PATH:-/ui/v2/login}'
    restart: unless-stopped
    # Inherit USER nextjs (UID/GID 1001) from Dockerfile.login.
    # The read-only login-client.pat must be accessible by this UID.
    environment:
      PORT: '${ZITADEL_LOGIN_PORT:-3000}'
      NEXT_PUBLIC_BASE_PATH: '${ZITADEL_LOGIN_BASE_PATH:-/ui/v2/login}'
      ZITADEL_API_URL: 'http://zitadel-api:${ZITADEL_INTERNAL_PORT:-8080}'
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      # Fail before deployment if the dedicated cookie signing secret is missing.
      ZITADEL_SESSION_COOKIE_SECRET: '${ZITADEL_SESSION_COOKIE_SECRET:?Configure a stable secret of at least 32 characters in Coolify}'
      CUSTOM_REQUEST_HEADERS: 'Host:${ZITADEL_DOMAIN},x-zitadel-instance-host:${ZITADEL_DOMAIN},x-zitadel-public-host:${ZITADEL_DOMAIN}'
      ZITADEL_TLS_ENABLED: '${ZITADEL_LOGIN_TLS_ENABLED:-false}'
      DEBUG: '${DEBUG:-false}'
    volumes:
      - '${ZITADEL_BOOTSTRAP_DIR:-/data/zitadel/bootstrap}:/zitadel/bootstrap:ro'
    networks:
      zitadel-network:
        aliases:
          - zitadel-login

networks:
  zitadel-network:
    external: true
    name: '${COOLIFY_NETWORK:-zitadel-sandbox}'
